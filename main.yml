
---
- name: Install Java 21 on worker nodes
  hosts: servers
  become: true

  tasks:
    - name: Update Ubuntu package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Java 21
      ansible.builtin.apt:
        name: "{{ java_package }}"
        state: present

    - name: Display installed Java alternatives
      ansible.builtin.command:
        cmd: update-alternatives --list java
      register: java_alternatives
      changed_when: false

    - name: Show available Java versions
      ansible.builtin.debug:
        var: java_alternatives.stdout_lines
