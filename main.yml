
---
- name: Install Java 8 and Java 21 on workers
  hosts: servers
  become: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Java 8
      ansible.builtin.apt:
        name: openjdk-8-jdk
        state: present

    - name: Install Java 21
      ansible.builtin.apt:
        name: openjdk-21-jdk
        state: present

    - name: Set Java 8 as default
      ansible.builtin.command:
        cmd: update-alternatives --set java /usr/lib/jvm/java-8-openjdk-amd64/bin/java

    - name: Verify default Java version
      ansible.builtin.command:
        cmd: java -version
      register: java_version
      changed_when: false

    - name: Display default Java version
      ansible.builtin.debug:
        var: java_version.stderr
